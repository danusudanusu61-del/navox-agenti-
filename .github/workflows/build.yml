name: Build NAVOX APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate Android project and build
        run: |
          set -e
          mkdir -p app/src/main/assets app/src/main/java/com/navox/agent app/src/main/res/drawable-nodpi
          mkdir -p .
          cat > settings.gradle <<'EOF'
          pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}
          dependencyResolutionManagement{repositories{google();mavenCentral()}}
          rootProject.name='NAVOX'
          include ':app'
          EOF
          mkdir -p .
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          mkdir -p .
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF
          mkdir -p app
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.navox.agent'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.navox.agent'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }

          dependencies {
              implementation 'net.java.dev.jna:jna:5.13.0@aar'
              implementation 'com.alphacephei:vosk-android:0.3.47'
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <uses-permission android:name="com.android.alarm.permission.SET_ALARM"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent>
                  <intent>
                      <action android:name="android.speech.RecognitionService"/>
                  </intent>
              </queries>
              <application
                  android:label="NAVOX AI"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              <service
                      android:name=".ListenService"
                      android:exported="false"
                      android:foregroundServiceType="microphone"/>
                  <service
                      android:name=".NavoxAccess"
                      android:exported="true"
                      android:label="NAVOX"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config"/>
                  </service>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FCFBF8" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_notif.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:strokeColor="#FFFFFF" android:strokeWidth="1.3" android:strokeLineJoin="round" android:fillColor="#00000000"
                  android:pathData="M12,2L20.58,7.05L20.58,16.95L12,22L3.42,16.95L3.42,7.05Z"/>
              <path android:strokeColor="#FFFFFF" android:strokeWidth="1.1" android:strokeLineCap="round" android:fillColor="#00000000"
                  android:pathData="M7.13,8.46L16.82,15.76"/>
              <path android:fillColor="#FFFFFF"
                  android:pathData="M7.13,8.46m-1.5,0a1.5,1.5 0,1 1,3 0a1.5,1.5 0,1 1,-3 0M16.82,8.46m-1.5,0a1.5,1.5 0,1 1,3 0a1.5,1.5 0,1 1,-3 0M7.26,15.76m-1.5,0a1.5,1.5 0,1 1,3 0a1.5,1.5 0,1 1,-3 0M16.82,15.76m-1.5,0a1.5,1.5 0,1 1,3 0a1.5,1.5 0,1 1,-3 0"/>
          </vector>
          EOF
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg"/>
              <foreground android:drawable="@drawable/ic_launcher_fg"/>
          </adaptive-icon>
          EOF
          mkdir -p app/src/main/res/mipmap-anydpi
          cat > app/src/main/res/mipmap-anydpi/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@drawable/ic_launcher_bg"/>
              <item android:drawable="@drawable/ic_launcher_fg"/>
          </layer-list>
          EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100"
              android:description="@string/a11y_desc"/>
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="a11y_desc">NAVOX uses this to take screenshots, press Back or Home, and flip Wi-Fi and Bluetooth switches when you ask.</string>
          </resources>
          EOF
          awk '/^@@@FILE /{f=$2; next} f{print > f}' "$(ls navox_bundle*.txt | head -n 1)"
          cp logo_fg.png app/src/main/res/drawable-nodpi/ic_launcher_fg.png
          curl -fL --retry 3 -o /tmp/vosk.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q /tmp/vosk.zip -d /tmp/voskm
          mv /tmp/voskm/vosk-model-small-en-us-0.15 app/src/main/assets/model
          echo navox-model-1 > app/src/main/assets/model/uuid
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NAVOX-APK

          path: app/build/outputs/apk/debug/app-debug.apk
