name: Build NAVOX APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate Android project and build
        run: |
          set -e
          mkdir -p app/src/main/assets
          mkdir -p .
          cat > settings.gradle <<'EOF'
          pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}
          dependencyResolutionManagement{repositories{google();mavenCentral()}}
          rootProject.name='NAVOX'
          include ':app'
          EOF
          mkdir -p .
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          mkdir -p .
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF
          mkdir -p app
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.navox.agent'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.navox.agent'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent>
              </queries>
              <application
                  android:label="NAVOX AI"
                  android:icon="@drawable/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp" android:height="96dp" android:viewportWidth="96" android:viewportHeight="96">
              <path android:fillColor="#080809" android:pathData="M0,0h96v96h-96z"/>
              <path android:strokeColor="#F4F4F5" android:strokeWidth="5" android:fillColor="#00000000" android:pathData="M48,48m-26,0a26,26 0,1 1,52 0a26,26 0,1 1,-52 0"/>
              <path android:fillColor="#F4F4F5" android:pathData="M48,48m-9,0a9,9 0,1 1,18 0a9,9 0,1 1,-18 0"/>
          </vector>
          EOF
          mkdir -p app/src/main/java/com/navox/agent
          cat > app/src/main/java/com/navox/agent/MainActivity.java <<'EOF'
          package com.navox.agent;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.speech.RecognizerIntent;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.ArrayList;

          public class MainActivity extends Activity {
              WebView web;
              static final int VOICE = 1;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(Color.parseColor("#080809"));
                  getWindow().setNavigationBarColor(Color.parseColor("#080809"));
                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#080809"));
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  web.addJavascriptInterface(new Bridge(), "NAVOX");
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          String u = r.getUrl().toString();
                          if (u.startsWith("file:")) return false;
                          openUrl(u, "");
                          return true;
                      }
                  });
                  web.loadUrl("file:///android_asset/index.html");
              }

              boolean openUrl(String url, String pkg) {
                  boolean hasPkg = pkg != null && !pkg.isEmpty();
                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                      if (hasPkg) i.setPackage(pkg);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                      return true;
                  } catch (Exception e) {
                      return hasPkg && openUrl(url, "");
                  }
              }

              void js(String code) {
                  web.evaluateJavascript(code, null);
              }

              class Bridge {
                  @JavascriptInterface
                  public boolean launch(String pkg) {
                      try {
                          Intent i = getPackageManager().getLaunchIntentForPackage(pkg);
                          if (i == null) return false;
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(i);
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public boolean openUrl(String url, String pkg) {
                      return MainActivity.this.openUrl(url, pkg);
                  }

                  @JavascriptInterface
                  public String getApps() {
                      JSONArray a = new JSONArray();
                      try {
                          PackageManager pm = getPackageManager();
                          Intent q = new Intent(Intent.ACTION_MAIN);
                          q.addCategory(Intent.CATEGORY_LAUNCHER);
                          for (ResolveInfo r : pm.queryIntentActivities(q, 0)) {
                              JSONObject o = new JSONObject();
                              o.put("n", r.loadLabel(pm).toString());
                              o.put("p", r.activityInfo.packageName);
                              a.put(o);
                          }
                      } catch (Exception e) { }
                      return a.toString();
                  }

                  @JavascriptInterface
                  public void listen(final String lang) {
                      runOnUiThread(new Runnable() {
                          public void run() {
                              try {
                                  Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, lang);
                                  startActivityForResult(i, VOICE);
                              } catch (Exception e) {
                                  js("window.onNativeVoiceError&&window.onNativeVoiceError()");
                              }
                          }
                      });
                  }
              }

              @Override
              protected void onActivityResult(int rq, int rs, Intent d) {
                  super.onActivityResult(rq, rs, d);
                  if (rq != VOICE) return;
                  if (rs == RESULT_OK && d != null) {
                      ArrayList<String> l = d.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS);
                      if (l != null && !l.isEmpty()) {
                          js("window.onNativeVoice(" + JSONObject.quote(l.get(0)) + ")");
                          return;
                      }
                  }
                  js("window.onNativeVoiceError&&window.onNativeVoiceError()");
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          EOF
          cp index.html app/src/main/assets/index.html
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NAVOX-APK
          path: app/build/outputs/apk/debug/app-debug.apk
