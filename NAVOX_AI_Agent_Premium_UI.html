<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b"><title>NAVOX AI — Agent</title>
<style>
:root{--bg:#080809;--panel:#101012;--card:#171719;--line:#29292d;--text:#f7f7f8;--muted:#a0a0a8;--soft:#6f6f78}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{overflow:hidden}.app{height:100dvh;display:flex;background:radial-gradient(ellipse at 58% 38%,#171719 0%,#0a0a0b 46%,#070708 100%)}
.sidebar{width:258px;flex-shrink:0;background:rgba(13,13,15,.92);border-right:1px solid #202024;padding:18px 14px;display:flex;flex-direction:column;z-index:4}.brand{display:flex;align-items:center;gap:10px;padding:8px 9px 25px;font-size:16px;letter-spacing:.13em;font-weight:750}.brand-mark{width:27px;height:27px;border:1px solid #626269;border-radius:50%;display:grid;place-items:center;position:relative}.brand-mark:before,.brand-mark:after{content:"";position:absolute;width:13px;height:19px;border:1.4px solid #eee;border-radius:50%;transform:rotate(42deg)}.brand-mark:after{transform:rotate(-42deg)}button{font:inherit;cursor:pointer}.newchat{width:100%;padding:13px 14px;text-align:left;border:1px solid #333338;border-radius:13px;background:#18181b;color:#f4f4f5;font-size:13px}.newchat:hover,.navbutton:hover{background:#222225}.nav{display:grid;gap:5px;margin-top:22px}.navbutton{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:#aaaab2;padding:12px;border-radius:10px;text-align:left;font-size:13px}.navbutton .ico{width:18px;text-align:center;color:#d6d6da;font-size:17px}.side-bottom{margin-top:auto;padding:13px 10px;color:#777780;font-size:11px;line-height:1.7}.main{min-width:0;flex:1;display:flex;flex-direction:column;position:relative}.topbar{height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 25px;border-bottom:1px solid rgba(255,255,255,.055);font-size:13px;color:#c9c9cf}.top-left{display:flex;align-items:center;gap:10px}.status-dot{width:6px;height:6px;border-radius:50%;background:#e9e9ed;box-shadow:0 0 12px #fff8}.top-actions{display:flex;align-items:center;gap:8px}.top-pill{border:1px solid #303034;border-radius:30px;padding:8px 12px;color:#bcbcc3;font-size:11px;background:#111113}.mobile-brand{display:none}.chat{flex:1;overflow-y:auto;padding:22px 20px 24px;scroll-behavior:smooth}.content{width:min(790px,100%);margin:0 auto}.welcome{text-align:center;padding:clamp(18px,5vh,55px) 0 25px}.orb-wrap{height:175px;display:grid;place-items:center;margin:0 auto 13px;position:relative}.orb-halo{position:absolute;width:180px;height:150px;border-radius:50%;background:radial-gradient(ellipse,rgba(190,194,205,.14),rgba(100,103,115,.04) 46%,transparent 70%);filter:blur(12px)}.orb{width:118px;height:118px;border-radius:50%;position:relative;overflow:hidden;background:radial-gradient(ellipse at 31% 23%,#fff 0%,#cfd2d7 8%,#656a72 16%,#16181d 31%,#aeb3bc 42%,#262a31 52%,#e5e7eb 61%,#484d55 72%,#101114 86%);box-shadow:inset -10px -13px 20px #000b,inset 6px 7px 17px #fff8,0 0 38px #b7bbc514;animation:float 5s ease-in-out infinite}.orb:before{content:"";position:absolute;inset:10px 6px;border-radius:47% 53% 55% 45%;background:conic-gradient(from 25deg,transparent,#f8f8f9 9%,#33363e 18%,#d9dce2 26%,transparent 34%,#111318 45%,#dfe1e6 55%,#535862 67%,transparent 79%,#f5f6f8 88%,transparent);filter:blur(3px);transform:rotate(-25deg);mix-blend-mode:screen}.orb:after{content:"";position:absolute;inset:29px 23px;border-radius:50%;background:radial-gradient(ellipse at 30% 25%,#121317 0%,#08090b 36%,#656a73 54%,#dfe1e5 59%,#24262c 66%,#08090b 75%);box-shadow:0 0 18px #000;transform:rotate(30deg)}@keyframes float{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-7px) rotate(4deg)}}.welcome h1{font-size:clamp(25px,3vw,36px);font-weight:500;letter-spacing:-.045em;margin:6px 0 10px}.welcome p{font-size:13px;line-height:1.6;color:#a1a1aa;margin:0 auto;max-width:420px}.feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:25px auto 20px;max-width:550px;text-align:left}.feature{min-height:85px;border:1px solid #29292e;border-radius:15px;background:linear-gradient(145deg,#1a1a1d,#121214);color:#f2f2f4;padding:14px;display:flex;align-items:flex-start;gap:12px;transition:transform .18s,border-color .18s}.feature:hover{transform:translateY(-2px);border-color:#5b5b63}.feature-icon{width:29px;height:29px;flex-shrink:0;border:1px solid #3a3a40;background:#222226;border-radius:9px;display:grid;place-items:center;color:#dedee3;font-size:15px}.feature strong{display:block;font-size:12px;font-weight:600;margin:2px 0 5px}.feature small{display:block;color:#8d8d96;font-size:10px;line-height:1.4}.feature .arrow{margin-left:auto;color:#aaaab2;font-size:17px}.suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 16px}.suggestion{border:1px solid #29292e;border-radius:30px;padding:9px 12px;background:#111113;color:#bdbdc5;font-size:11px}.suggestion:hover{background:#222225;color:#fff}.message{display:flex;gap:12px;margin:24px 0;align-items:flex-start;animation:appear .2s ease}@keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}.avatar{width:31px;height:31px;min-width:31px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;border:1px solid #3a3a40;background:#17171a;color:#eee}.agent .avatar{background:#eee;color:#111;border-color:#eee}.bubble{padding:5px 0;max-width:calc(100% - 45px);font-size:14px;line-height:1.65;word-break:break-word;color:#ededf0}.user .bubble{background:#1a1a1d;border:1px solid #303035;padding:11px 14px;border-radius:15px}.meta{font-size:10px;color:#888891;margin-top:7px;letter-spacing:.02em}.composer-area{flex-shrink:0;padding:10px 20px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#09090a 24%)}.composer{max-width:790px;margin:auto;display:flex;align-items:center;gap:9px;border:1px solid #3a3a40;background:rgba(24,24,27,.96);padding:7px;border-radius:18px;box-shadow:0 8px 35px #0005}.icon-btn{width:42px;height:42px;flex-shrink:0;border:0;border-radius:13px;background:#29292e;color:#f4f4f5;display:grid;place-items:center}.icon-btn.active{background:#f4f4f5;color:#111}.input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;padding:11px 3px;font-size:14px}.input::placeholder{color:#777780}.send{width:42px;height:42px;border:0;border-radius:13px;background:#f1f1f3;color:#111;font-size:21px;font-weight:500;display:grid;place-items:center}.send:hover{background:#d7d7db}.status{max-width:790px;margin:8px auto 0;text-align:center;font-size:10px;color:#777780;min-height:13px}.menu-btn{display:none;border:1px solid #303034;border-radius:10px;background:#171719;color:#eee;padding:7px 10px}
@media(max-width:760px){.sidebar{position:fixed;left:-270px;top:0;bottom:0;transition:left .25s;box-shadow:15px 0 50px #0008}.sidebar.open{left:0}.mobile-brand{display:inline;font-weight:700;letter-spacing:.08em}.topbar{height:57px;padding:0 14px}.menu-btn{display:block}.top-pill{padding:7px 9px}.chat{padding:12px 15px 15px}.welcome{padding:2vh 0 16px}.orb-wrap{height:142px;margin-bottom:4px}.orb{width:102px;height:102px}.orb-halo{width:150px;height:125px}.welcome h1{font-size:28px}.welcome p{font-size:12px;padding:0 12px}.feature-grid{gap:8px;margin:21px auto 15px}.feature{padding:12px;min-height:83px;gap:9px;border-radius:13px}.feature-icon{width:26px;height:26px}.feature strong{font-size:11px}.feature small{font-size:9px}.suggestions{gap:6px}.suggestion{font-size:10px;padding:8px 10px}.composer-area{padding:8px 12px calc(10px + env(safe-area-inset-bottom))}.composer{border-radius:17px;gap:6px}.icon-btn,.send{width:39px;height:39px;border-radius:12px}.input{font-size:13px}.status{font-size:9px}.top-actions{gap:5px}}
@media(max-width:360px){.feature{padding:10px 8px}.feature small{display:none}.feature-grid{gap:7px}.orb-wrap{height:125px}.orb{width:92px;height:92px}.welcome h1{font-size:25px}}
</style></head>
<body><div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><span class="brand-mark"></span><span>NAVOX AI</span></div><button class="newchat" onclick="newChat()">＋ &nbsp; New conversation</button><div class="nav"><button class="navbutton" onclick="focusInput()"><span class="ico">⌕</span>Search the web</button><button class="navbutton" onclick="fillCommand('Open YouTube')"><span class="ico">▣</span>Quick actions</button><button class="navbutton" onclick="showInfo()"><span class="ico">◌</span>About NAVOX</button></div><div class="side-bottom">NAVOX AI AGENT<br>Intent · Action · Verify<br><span style="color:#55555d">Chrome Edition · Preview</span></div></aside>
<main class="main"><header class="topbar"><div class="top-left"><button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button><span class="mobile-brand">NAVOX</span><span class="status-dot"></span><span>AI Agent <span style="color:#73737c">/ Ready</span></span></div><div class="top-actions"><span class="top-pill">PREVIEW</span></div></header>
<section class="chat" id="chat"><div class="content" id="messages"><div class="welcome" id="welcome"><div class="orb-wrap"><div class="orb-halo"></div><div class="orb"></div></div><h1>Good to see you.</h1><p>I'm NAVOX. What can I help you with today?</p>
<div class="feature-grid"><button class="feature" onclick="fillCommand('Search latest AI news')"><span class="feature-icon">⌕</span><span><strong>Web Search</strong><small>Find answers across the web</small></span><span class="arrow">↗</span></button><button class="feature" onclick="startVoice()"><span class="feature-icon">♩</span><span><strong>Voice Control</strong><small>Speak a command to NAVOX</small></span><span class="arrow">↗</span></button><button class="feature" onclick="fillCommand('Search how to build an AI agent')"><span class="feature-icon">▤</span><span><strong>Learn & Explore</strong><small>Discover ideas and explanations</small></span><span class="arrow">↗</span></button><button class="feature" onclick="fillCommand('Open Instagram')"><span class="feature-icon">◎</span><span><strong>Quick Actions</strong><small>Open supported websites</small></span><span class="arrow">↗</span></button></div>
<div class="suggestions"><button class="suggestion" onclick="fillCommand('Open YouTube')">Open YouTube ↗</button><button class="suggestion" onclick="fillCommand('Open Instagram')">Open Instagram ↗</button><button class="suggestion" onclick="fillCommand('Search AI tools')">Explore AI tools ↗</button></div></div></div></section>
<div class="composer-area"><div class="composer"><button class="icon-btn" id="mic" title="Voice command" aria-label="Voice command"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="8.5" y="3" width="7" height="12" rx="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M9 21h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><input class="input" id="input" placeholder="Message NAVOX..." autocomplete="off"><button class="send" id="send" aria-label="Send">↑</button></div><div class="status" id="status">Ready when you are · Enter to send</div></div></main></div>
<script>
const input=document.getElementById('input'),messages=document.getElementById('messages'),status=document.getElementById('status'),mic=document.getElementById('mic');
const sites={youtube:'https://www.youtube.com/',instagram:'https://www.instagram.com/',chatgpt:'https://chatgpt.com/',chrome:'https://www.google.com/',gmail:'https://mail.google.com/',google:'https://www.google.com/'};
const stores={youtube:'https://play.google.com/store/apps/details?id=com.google.android.youtube',instagram:'https://play.google.com/store/apps/details?id=com.instagram.android',chatgpt:'https://play.google.com/store/apps/details?id=com.openai.chatgpt',chrome:'https://play.google.com/store/apps/details?id=com.android.chrome',gmail:'https://play.google.com/store/apps/details?id=com.google.android.gm'};
function addMessage(text,type,meta=''){document.getElementById('welcome')?.remove();const row=document.createElement('div');row.className='message '+type;const av=document.createElement('div');av.className='avatar';av.textContent=type==='user'?'YOU':'N';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;if(meta){const m=document.createElement('div');m.className='meta';m.textContent=meta;bubble.appendChild(m)}row.append(av,bubble);messages.appendChild(row);document.getElementById('chat').scrollTop=999999}
function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const v=new SpeechSynthesisUtterance(text);v.lang='en-IN';v.rate=.95;v.pitch=.9;speechSynthesis.speak(v)}
function cleanTarget(t){return t.toLowerCase().replace(/[.,!?]/g,'').trim()}
function detectCommand(raw){const c=cleanTarget(raw),names=['youtube','instagram','chatgpt','chrome','gmail'];for(const name of names){for(const p of [new RegExp('^open\\s+'+name+'\\s+and\\s+search\\s+(.+)$','i'),new RegExp('^open\\s+'+name+'\\s+search\\s+(.+)$','i'),new RegExp('^launch\\s+'+name+'\\s+and\\s+search\\s+(.+)$','i')]){const m=c.match(p);if(m)return{type:'APP_SEARCH',name,query:m[1].trim()}}}for(const name of names){if(c.includes(name)&&(c.includes('play store')||c.includes('playstore')||c.startsWith('install '+name)||c.startsWith('update '+name)))return{type:'STORE',name};if(c==='open '+name||c==='open '+name+' app'||c==='launch '+name||c==='open '+name+' website')return{type:'WEB',name}}if(c==='open google'||c==='launch google')return{type:'WEB',name:'google'};if(c.startsWith('search '))return{type:'SEARCH',query:raw.trim().slice(7)};if(c.startsWith('find '))return{type:'SEARCH',query:raw.trim().slice(5)};return{type:'SEARCH',query:raw.trim()}}
function runCommand(){const raw=input.value.trim();if(!raw)return;input.value='';addMessage(raw,'user');status.textContent='Understanding your request…';const cmd=detectCommand(raw);setTimeout(()=>{if(cmd.type==='APP_SEARCH'){const msg='Opening '+cmd.name+' and searching for '+cmd.query+'.';addMessage(msg,'agent','Action · Open → Search');status.textContent='Opening '+cmd.name+'…';speak('Opening '+cmd.name+'.');setTimeout(()=>{const q=encodeURIComponent(cmd.query),urls={youtube:'https://www.youtube.com/results?search_query='+q,instagram:'https://www.instagram.com/explore/search/keyword/?q='+q,chatgpt:'https://chatgpt.com/?q='+q,chrome:'https://www.google.com/search?q='+q,gmail:'https://mail.google.com/mail/u/0/#search/'+q};location.href=urls[cmd.name]||sites[cmd.name]},850);return}if(cmd.type==='STORE'){const msg='Opening '+cmd.name+' Play Store page.';addMessage(msg,'agent','Action · Play Store');status.textContent='Opening Play Store…';speak(msg);setTimeout(()=>location.href=stores[cmd.name],500);return}if(cmd.type==='WEB'){const msg='Opening '+cmd.name+'.';addMessage(msg,'agent','Action · Official website');status.textContent='Opening website…';speak(msg);setTimeout(()=>location.href=sites[cmd.name]||sites.google,600);return}const msg='Searching the web for '+cmd.query+'.';addMessage(msg,'agent','Action · Web search');status.textContent='Searching…';speak(msg);setTimeout(()=>location.href='https://www.google.com/search?q='+encodeURIComponent(cmd.query),600)},180)}
function fillCommand(t){input.value=t;input.focus();if(window.innerWidth<760)document.getElementById('sidebar').classList.remove('open')}
function focusInput(){input.focus();document.getElementById('sidebar').classList.remove('open')}
function newChat(){messages.innerHTML=`<div class="welcome" id="welcome"><div class="orb-wrap"><div class="orb-halo"></div><div class="orb"></div></div><h1>Good to see you.</h1><p>I'm NAVOX. What can I help you with today?</p><div class="feature-grid"><button class="feature" onclick="fillCommand('Search latest AI news')"><span class="feature-icon">⌕</span><span><strong>Web Search</strong><small>Find answers across the web</small></span><span class="arrow">↗</span></button><button class="feature" onclick="startVoice()"><span class="feature-icon">♩</span><span><strong>Voice Control</strong><small>Speak a command to NAVOX</small></span><span class="arrow">↗</span></button><button class="feature" onclick="fillCommand('Search how to build an AI agent')"><span class="feature-icon">▤</span><span><strong>Learn & Explore</strong><small>Discover ideas and explanations</small></span><span class="arrow">↗</span></button><button class="feature" onclick="fillCommand('Open Instagram')"><span class="feature-icon">◎</span><span><strong>Quick Actions</strong><small>Open supported websites</small></span><span class="arrow">↗</span></button></div><div class="suggestions"><button class="suggestion" onclick="fillCommand('Open YouTube')">Open YouTube ↗</button><button class="suggestion" onclick="fillCommand('Open Instagram')">Open Instagram ↗</button><button class="suggestion" onclick="fillCommand('Search AI tools')">Explore AI tools ↗</button></div></div>`;status.textContent='Ready when you are · Enter to send';input.focus()}
function showInfo(){addMessage('NAVOX AI is a browser-based agent preview. It can open the supported websites and run web searches. This HTML preview cannot directly control every installed Android app.','agent','About NAVOX');document.getElementById('sidebar').classList.remove('open')}
document.getElementById('send').onclick=runCommand;input.addEventListener('keydown',e=>{if(e.key==='Enter')runCommand()});document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
function startVoice(){const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech){addMessage('Voice recognition is not available in this browser. Try Chrome and allow microphone permission.','agent');status.textContent='Voice unavailable';return}const r=new Speech();r.lang='en-IN';r.interimResults=false;r.continuous=false;r.onstart=()=>{mic.classList.add('active');mic.textContent='■';input.placeholder='Listening…';status.textContent='Listening…'};r.onresult=e=>{input.value=e.results[0][0].transcript;runCommand()};r.onerror=e=>{addMessage(e.error==='not-allowed'?'Microphone permission was denied. Allow microphone access in Chrome.':'I could not understand the voice command.','agent');status.textContent='Voice error'};r.onend=()=>{mic.classList.remove('active');mic.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="8.5" y="3" width="7" height="12" rx="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M9 21h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';input.placeholder='Message NAVOX...'};try{r.start()}catch(e){}}
mic.onclick=startVoice;
</script></body></html>
